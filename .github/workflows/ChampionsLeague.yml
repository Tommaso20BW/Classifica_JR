name: Aggiorna Classifica Live - Champions League
on:
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test estrazione: non invia su Telegram e non modifica il repository'
        required: false
        default: false
        type: boolean
      channel:
        description: 'Destinazione Telegram'
        required: true
        default: 'Juventus Reborn'
        type: choice
        options:
          - Juventus Reborn
          - Bot JR
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'                      # cache dei pacchetti pip

      - name: Attendi il turno degli altri bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u attendi_turno.py

      - name: Installa Dipendenze
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt

      - name: Cache browser Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Installa Browser Playwright (solo se non in cache)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Installa dipendenze di sistema (browser gia' in cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Esegui Script Classifica
        env:
          COMPETITION: UCL
          TEST_ONLY: ${{ inputs.test_only }}
        run: python -u aggiorna_classifica.py

      - name: Verifica rendering completo dei loghi
        if: ${{ inputs.test_only }}
        env:
          TEST_ONLY: "true"
        run: python -u screenshot_telegram.py

      - name: Invia Screenshot su Telegram
        if: ${{ !inputs.test_only }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.channel == 'Bot JR' && secrets.TELEGRAM_CHAT_ID_BOT_JR || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DESTINATION: ${{ inputs.channel }}
          COMPETITION: UCL
        run: python -u screenshot_telegram.py

      - name: Commit e Push del JSON
        if: ${{ !inputs.test_only }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add classifica.json
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Classifica aggiornata automaticamente (UCL)' && git push)

      - name: Pulisci la cronologia dei run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"   # 0 = cancella TUTTI i run precedenti; resta visibile solo quello in corso
                      # (un run non puo' cancellare se' stesso mentre gira: limite di GitHub)
        run: |
          # Cancella i run COMPLETATI di questo stesso workflow,
          # tenendo solo gli ultimi $KEEP.
          gh api "repos/${{ github.repository }}/actions/workflows/ChampionsLeague.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            echo "Elimino run $RUN_ID"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$RUN_ID" || true
          done
          echo "Pulizia completata."
